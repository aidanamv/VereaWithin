services:
  - type: web
    name: verea-within
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: verea.within@gmail.com
      - key: FROM_EMAIL
        value: verea.within@gmail.com
      - key: NOTIFY_EMAIL
        value: verea.within@gmail.com
      # Secret values — set these in the Render dashboard (do NOT commit them):
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_API_KEY
        sync: false

